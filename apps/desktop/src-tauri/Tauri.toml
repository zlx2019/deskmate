productName = "Deskmate"
version = "../package.json"
identifier = "io.github.zlx2019.deskmate"

[build]
beforeDevCommand = "pnpm dev"
devUrl = "http://localhost:1420"
beforeBuildCommand = "pnpm build"
frontendDist = "../dist"

[app]
[app.security]
# connect-src must allow the raw-binary IPC fetch (ipc: on macOS/Linux,
# http://ipc.localhost on Windows). Without it the packaged app silently falls
# back to the postMessage channel, which cannot carry raw bodies, breaking
# screenshot sends. blob: covers copy-image fetching message-stream Blob URLs.
csp = "default-src 'self'; connect-src 'self' ipc: http://ipc.localhost blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'"

[[app.windows]]
title = "Deskmate"
width = 1120
height = 780
minWidth = 760
minHeight = 560
dragDropEnabled = true
backgroundColor = "#90c9a1"

[bundle]
active = true
targets = ["app", "dmg", "nsis", "appimage", "deb"]
publisher = "zlx2019"
copyright = "Copyright © 2026 zlx2019"
category = "Utility"
shortDescription = "LAN file and text transfer"
longDescription = "Deskmate is a desktop application for transferring files/text within a local area network: no central server, automatic discovery of devices on the same subnet, drag and drop onto a device avatar to send, with TLS encryption throughout."
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

[bundle.macos]
minimumSystemVersion = "10.15"
# Ad-hoc signing ("-"): with no identity at all the bundler skips codesign
# entirely, and a quarantined app without a bundle seal is rejected by
# Gatekeeper as "damaged" with no Open Anyway escape hatch. Ad-hoc signing
# restores the normal unidentified-developer flow. A real certificate still
# wins: the CLI prefers the APPLE_SIGNING_IDENTITY env var over this value,
# which is what release.yml exports when the Apple secrets are configured.
signingIdentity = "-"

# Localized permission-dialog strings; destination is relative to .app/Contents
[bundle.macos.files]
"Resources/zh-Hans.lproj/InfoPlist.strings" = "macos/zh-Hans.lproj/InfoPlist.strings"

[bundle.windows.nsis]
installMode = "perMachine"
installerHooks = "windows/hooks.nsh"
# Installer UI follows the OS language; first entry is the fallback
languages = ["English", "SimpChinese"]

[bundle.linux.deb]
